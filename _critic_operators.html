<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRITIC BOOT</title>
<!-- ===========================================================================
     _critic_operators.html  --  standalone OPERATOR LOOK-DEV STUDIO.

     Owned by the CRITIC-RIG agent.  Does NOT load NUKEM.html: the game spends
     ~35 s building a level and baking five modules' worth of textures before
     the first frame, which does not fit in a 45 s shell call.  This page loads
     only three.js + nz-core + nz-render + nz-enemies, synthesises the handful
     of game globals nz-enemies probes for, and drives the rig through the same
     NZ hook bus NUKEM.html uses.  Boot to first converged frame is ~5 s.

     Nothing here fakes quality.  The lights, the IBL probe, the shadow config,
     the post stack, the materials and the skinned geometry are all the real
     module code; only the *stage* (ground, grey card, chrome ball, colour
     chart) is local, and it is deliberately neutral so the character art is
     judged on its own rather than on the level's night lighting.

     ------------------------------------------------------------------ params
       kind=trooper|pig|enforcer|octa      which operator
       pose=idle|aim|walk|run|crouch|turn|dead
       view=front|side|back|tq|back34|top  camera azimuth family
       cell=full|head|hands|weld|feet|weapon|calib|silhouette
            |maps|roster|anim|scale
       env=studio|level                    WHICH LIGHT. `studio` is the
                                           calibrated neutral rig (18% grey in
                                           -> 18% grey out, see CALIB below).
                                           `level` mirrors NUKEM.html's own
                                           key / ambient / fog / background so
                                           an operator is judged in the light
                                           the player will really see.
       sheet=a:b:c:d,a:b:c:d,...           contact sheet (kind:pose:view:cell)
       cols=N                              sheet columns
       w= h=                               OUTPUT size of one cell, px
       ss=1..3                             supersample: render at ss x, box down
       nzq=low|med|high|ultra              pinned render tier (read by nz-render)
       nzr=0|1                             use nz-render post stack (default 1)
       taa=N                               TAA converge frames (default 3)
       frames=N                            cell=anim: strip length (default 8)
       keyaz= keyel=                       key light azimuth / elevation, deg.
                                           Default: 52 deg off the FIRST cell's
                                           camera, 34 up. Baked once -- the IBL
                                           probe is built from it -- so a whole
                                           sheet shares one light.
       keyi= envi=                         studio key intensity / probe mean
                                           radiance. Defaults are the CALIBRATED
                                           pair; overriding either is announced.
       ev=<stops>                          nudge nz-render's exposure. Default 0
                                           (untouched); any other value is
                                           announced in the header strip.
       fov=<deg>                           force one focal length everywhere
       deadline=<ms>                       stop starting cells after this
       seed=N                              Math.random seed
       labels=0|1                          burn-in captions (default 1)
       grid=0|1                            thirds guides (default 0)
       dbg=1                               per-phase console tracing
       fence=1                             gl.finish() per frame (honest timings)

     The page publishes:
       document.title = 'CRITIC CELL k/n'  cell k has finished and is fetchable
       document.title = 'CRITIC READY'     every planned cell has converged
       window.__criticCellPNG(k)           -> dataURL of one finished cell
       window.__criticPNG()                -> dataURL of the whole composited sheet
       window.__criticInfo                 -> timings, warnings, rig stats,
                                              measured weapon OAL
     ======================================================================== -->
<style>
  html,body{margin:0;padding:0;background:#101214;overflow:hidden}
  #sheet{display:block;position:absolute;left:0;top:0}
  #gl{position:absolute;left:-10000px;top:0}
</style>

<body>
<canvas id="sheet"></canvas>
<canvas id="gl"></canvas>

<script>
/* ------------------------------------------------------------------ params */
window.__T = { t0: performance.now(), marks: [] };
window.__mark = function (n) { window.__T.marks.push([n, performance.now() - window.__T.t0]); };
(function () {
  var q = {}, s = location.search.replace(/^\?/, '');
  s.split('&').forEach(function (kv) {
    if (!kv) return; var i = kv.indexOf('=');
    q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1));
  });
  window.__Q = q;
})();
</script>

<script src="vendor/three.r149.min.js"></script>
<script src="nz-core.js"></script>

<script>
/* ============================================================================
   GAME-GLOBAL SHIMS
   nz-enemies.js probes for these by bare name in probeGlobals().  Shapes are
   copied from NUKEM.html's spawnEnemy / player / state so the module is
   measuring the game, not the harness.  ECFG is pulled out of NUKEM.html at
   load time -- the AI agent owns that file and its numbers move, so reading
   the literal is the only way to stay in sync.  Falls back loudly.
   ========================================================================= */
window.__mark('three+core');
var CRITIC_WARN = [];
function cwarn(s) { CRITIC_WARN.push(s); try { console.warn('[critic] ' + s); } catch (e) {} }

var ECFG_FALLBACK = {
  trooper:  { tex:'e_trooper', hp:78, spd:13, rad:1.6, w:5.0, h:6.4, sight:104, keep:30, stride:4.6, glow:[1,.17,.09], range:120, accel:54, decel:88, turn:7.6, zone:{head:4,body:1,limb:.78} },
  pig:      { tex:'e_pig', hp:118, spd:12, rad:1.82, w:6.2, h:7.2, sight:78, keep:11, stride:5.2, glow:[.45,.85,1], range:44, accel:46, decel:70, turn:6.2, zone:{head:2.7,body:.88,limb:.68} },
  enforcer: { tex:'e_enforcer', hp:100, spd:14, rad:1.80, w:6.0, h:7.8, sight:112, keep:26, stride:5.6, glow:[1,.60,.12], range:128, accel:60, decel:92, turn:8.0, zone:{head:3.4,body:.95,limb:.72} },
  octa:     { tex:'e_octa', hp:72, spd:11.5, rad:1.7, w:5.2, h:6.2, sight:170, keep:72, stride:4.4, float:0, glow:[.5,1,.38], range:150, accel:34, decel:62, turn:5.6, zone:{head:3.8,body:.92,limb:.7} }
};

/* brace-matched literal extraction: survives comments and nested objects */
function extractLiteral(src, name) {
  var re = new RegExp('(?:^|\\n)\\s*(?:const|let|var)\\s+' + name + '\\s*=\\s*\\{'), m = re.exec(src);
  if (!m) return null;
  var j = src.indexOf('{', m.index), d = 0, k = j, inS = 0, esc = 0;
  for (; k < src.length; k++) {
    var ch = src[k];
    if (inS) { if (esc) esc = 0; else if (ch === '\\') esc = 1; else if (ch === inS) inS = 0; continue; }
    if (ch === '"' || ch === "'" || ch === '`') { inS = ch; continue; }
    if (ch === '/' && src[k + 1] === '*') { k = src.indexOf('*/', k); if (k < 0) return null; k++; continue; }
    if (ch === '/' && src[k + 1] === '/') { k = src.indexOf('\n', k); if (k < 0) return null; continue; }
    if (ch === '{') d++;
    else if (ch === '}') { d--; if (d === 0) { k++; break; } }
  }
  return src.slice(j, k);
}

var ECFG = null, ERIG = { geo: null, mats: {}, near: 25, far: 29, max: 8 };
(function () {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'NUKEM.html', false); x.send(null);
    var src = x.responseText || '';
    var lit = extractLiteral(src, 'ECFG');
    if (lit) ECFG = (0, eval)('(' + lit + ')');
    var el = extractLiteral(src, 'ERIG');
    if (el) { try { ERIG = (0, eval)('(' + el + ')'); } catch (e) {} }
  } catch (err) { cwarn('could not read NUKEM.html for ECFG (' + err.message + ')'); }
  if (!ECFG || !ECFG.trooper) {
    ECFG = ECFG_FALLBACK;
    cwarn('ECFG NOT FOUND IN NUKEM.html - using the CS2-ENEMY-BRIEF table. Heights/strides may be stale.');
  }
})();
window.__mark('ecfg');

/* the rest of the surface probeGlobals() reaches for */
var enemies = [];
var player = { x: 0, y: 0, z: 26, r: 1.4, hp: 100, vx: 0, vz: 0 };
var state  = { playing: true, booted: true, t: 0, over: false };
var EYE = 2.85;
function moveSlide(x, z, dx, dz, r, floor) { return [x + dx, z + dz]; }
function particle() {}
function highestFloor() { return 0; }
function floorAt() { return 0; }
function sfx() {}

/* deterministic: reseed before any module can draw a random number */
(function () {
  var seed = (window.__Q.seed | 0) || 20260803;
  if (NZ.tex && NZ.tex.mulberry32) Math.random = NZ.tex.mulberry32(seed >>> 0);
})();

/* nz-render is optional so a blown frame budget can be isolated from a blown
   asset budget.  document.write keeps the classic-script load order exact. */
if (window.__Q.nzr !== '0') document.write('<scr' + 'ipt src="nz-render.js"></scr' + 'ipt>');
</script>

<script src="nz-enemies.js"></script>

<script>
/* ============================================================================
   THE STUDIO
   ========================================================================= */
(function () {
'use strict';
var Q = window.__Q, T = window.__T;
window.__mark('modules');

var THREE = window.THREE;
/* Phase tracing. Off by default: the runner's console channel is the only
   window into a hung page, and 40 lines of blit timings in it is how a real
   error gets missed. `dbg=1` turns it on. */
var DBG = /[?&]dbg=1/.test(location.search);
function dbg(s) { if (!DBG) return; try { console.log('[critic] ' + ((performance.now() - T.t0) | 0) + 'ms ' + s); } catch (e) {} }
var num = function (k, d) { var v = parseFloat(Q[k]); return isFinite(v) ? v : d; };
var str = function (k, d) { return Q[k] !== undefined && Q[k] !== '' ? String(Q[k]) : d; };

var CELL_W = Math.max(64, num('w', 900) | 0);
var CELL_H = Math.max(64, num('h', 900) | 0);
var SS     = Math.max(1, Math.min(3, num('ss', 1)));
var LABELS = str('labels', '1') !== '0';
var GRID   = str('grid', '0') !== '0';
var TAA_N  = Math.max(1, num('taa', 3) | 0);
var USE_R  = Q.nzr !== '0';
var FENCE  = str('fence', '0') !== '0'; /* gl.finish() per frame: honest timings */
var FOV_OVERRIDE = num('fov', 0);       /* force one focal length everywhere */
/* The runner has a hard 40 s shell wall. The page is the only thing that knows
   how long a cell actually took, so it -- not the runner -- decides when to
   stop starting new ones. Cells that do not fit are simply not rendered and
   never announced; the runner reports them as still pending. */
var DEADLINE = num('deadline', 0);      /* ms since page start, 0 = no limit */
var FRAMES_N = Math.max(2, Math.min(12, num('frames', 8) | 0));

/* ------------------------------------------------------------ environment --
   Two rigs, and the header always says which one you are looking at.

   studio  a calibrated neutral look-dev set.  The whole point of a look-dev
           stage is that the numbers coming out of it are trustworthy: an 18%
           grey card must render as 18% grey, or every albedo decision made
           from the image is made against a lie.  See CALIB below.
   level   NUKEM.html's own rig, verbatim -- the level's fog, background,
           light colours, light intensities and key azimuth, handed to
           nz-render exactly as boot() hands them over, with NOTHING of this
           page's calibration applied.  This is the light the player sees.
           If it disagrees with `studio`, that disagreement is the finding. */
var ENVMODE = (str('env', 'studio') === 'level') ? 'level' : 'studio';

/* Mirrored from NUKEM.html boot() -- the four lights, the fog and the clear
   colour, at the values the game ships.  nz-render then rebalances them on
   rendererInit/ready exactly as it does in game, so `level` really is the
   in-game rig and not an approximation of it. */
var LEVEL_RIG = {
  background: 0x01030a,
  fog: { color: 0x01040b, near: 52, far: 338 },
  ambient: { color: 0xfff3df, intensity: 0.80 },
  skyFill: { sky: 0x92bcff, ground: 0x24150d, intensity: 0.27 },
  sunKey:  { color: 0xffd5a8, intensity: 0.62, offset: [-72, 118, 58] },
  coolRim: { color: 0x628aff, intensity: 0.22, position: [105, 54, -92] },
  /* atan2(x,z) of the key offset: the azimuth the level author chose, which
     is what puts light on the facades the street views show lit */
  keyAz: Math.atan2(-72, 58) * 180 / Math.PI,
  /* concrete, not studio neutral: a 45% white cyc under the operator would
     bounce light the real level has nowhere to come from */
  ground: 0x4a4844, backdrop: 0x15171b
};

var KINDS = ['trooper', 'pig', 'enforcer', 'octa'];
var DISPLAY = (NZ.enemies && NZ.enemies.displayName) ||
  { trooper: 'RIFLEMAN', pig: 'BREACHER', enforcer: 'ASSAULTER', octa: 'MARKSMAN' };
var KIT = { trooper: 'AK-pattern AR', pig: 'combat shotgun', enforcer: 'M4-pattern AR', octa: 'bolt DMR' };

/* --------------------------------------------------------------- the plan */
/* One "cell" is one rendered image.  A single-cell run is the cheap default;
   sheet= builds a grid out of many.  Format kind:pose:view:cell, any field
   may be '-' to inherit the URL default. */
function parseCell(spec, dflt) {
  var p = String(spec).split(':');
  var pick = function (i, d) { return (p[i] && p[i] !== '-') ? p[i] : d; };
  return {
    kind: pick(0, dflt.kind), pose: pick(1, dflt.pose),
    view: pick(2, dflt.view), cell: pick(3, dflt.cell)
  };
}
var DFLT = { kind: str('kind', 'trooper'), pose: str('pose', 'aim'), view: str('view', 'tq'), cell: str('cell', 'full') };
var PLAN = Q.sheet ? String(Q.sheet).split(',').filter(Boolean).map(function (s) { return parseCell(s, DFLT); })
                   : [parseCell('-:-:-:-', DFLT)];
var COLS = Math.max(1, num('cols', Math.min(PLAN.length, Math.ceil(Math.sqrt(PLAN.length)))) | 0);
var ROWS = Math.ceil(PLAN.length / COLS);

/* -------------------------------------------------------------- 2D output */
var sheet = document.getElementById('sheet');
sheet.width  = COLS * CELL_W;
sheet.height = ROWS * CELL_H;
/* willReadFrequently is not an optimisation here, it is a correctness fix.
   Under SwiftShader in chrome-headless-shell, ANY path that hands a WebGL
   canvas to the 2D compositor -- drawImage(glCanvas) into an accelerated
   canvas, or toDataURL() on the result -- deadlocks and never returns. So the
   canvas is pinned CPU-side and pixels arrive by gl.readPixels (see blitGL),
   which never touches the compositor at all. */
var s2d = sheet.getContext('2d', { willReadFrequently: true });
s2d.fillStyle = '#0d0f11'; s2d.fillRect(0, 0, sheet.width, sheet.height);
(function () {   /* keep the sheet on screen whatever its aspect */
  var k = Math.min(1, 1400 / sheet.width, 1000 / sheet.height);
  sheet.style.width = Math.round(sheet.width * k) + 'px';
  sheet.style.height = Math.round(sheet.height * k) + 'px';
})();

/* -------------------------------------------------------------- renderer */
var RW = Math.round(CELL_W * SS), RH = Math.round(CELL_H * SS);
var glc = document.getElementById('gl');
glc.width = RW; glc.height = RH;
var renderer = new THREE.WebGLRenderer({
  canvas: glc, antialias: SS < 2, alpha: false, stencil: false, depth: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(1);
renderer.setSize(RW, RH, false);
if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace; else renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* --------------------------------------------------- capture redirection --
   chrome-headless-shell + SwiftShader cannot read the DEFAULT framebuffer:
   gl.readPixels(0,...) on the canvas, drawImage(glCanvas) and toDataURL() on
   the result all block forever inside the compositor.  Reading an FBO we own
   works (nz-render does it internally every boot).  So setRenderTarget(null)
   is remapped to a capture target of exactly the drawing-buffer size: every
   pass, including nz-render's final FXAA present, lands there instead of on
   the canvas, and the bytes are identical -- three.js only applies an output
   colour-space conversion of its own for MeshStandard-family materials, and
   the target carries the same SRGBColorSpace the canvas would have. */
var capRT = new THREE.WebGLRenderTarget(RW, RH, {
  format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: true, stencilBuffer: false, generateMipmaps: false
});
if (THREE.SRGBColorSpace) capRT.texture.colorSpace = THREE.SRGBColorSpace;
else capRT.texture.encoding = THREE.sRGBEncoding;
var _setRT = renderer.setRenderTarget.bind(renderer);
renderer.setRenderTarget = function (t, a, m) { return _setRT((t === null || t === undefined) ? capRT : t, a, m); };

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, RW / RH, 0.4, 900);
camera.rotation.order = 'YXZ';
window.__mark('gl');

/* ============================================================== the stage */
/* Neutral look-dev set.  Real-world scale: SCALE = 3.5 world units / metre
   (CS2-ENEMY-BRIEF section 2), so a 1 m grey card is 3.5 units. */
var SCALE = 3.5;
var M = function (metres) { return metres * SCALE; };

var STAGE = { props: new THREE.Group(), backdrop: null };
scene.add(STAGE.props);

function stdMat(hex, rough, metal) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(hex), roughness: rough, metalness: metal === undefined ? 0 : metal });
}
/* ------------------------------------------- THE COLOUR-SPACE LANDMINE ----
   three r149 ships `ColorManagement.legacyMode = true`, and Color.setHex()
   bails out of toWorkingColorSpace() when it is.  So `new Color(0x767676)`
   does NOT give an 18% reflectance surface -- it gives 0x76/255 = 0.463 used
   RAW AS LINEAR, which is 46% reflectance, a stop and a third brighter than
   the number in the source says.  Textures are different: a CanvasTexture
   tagged SRGBColorSpace IS decoded in the shader.  So in this build every
   TEXTURED surface is correct and every surface tinted by a bare hex constant
   is roughly a stop too bright, and the two disagree with each other.

   That is not a studio problem, it is a project problem -- it is in the
   report -- but the calibration props have to be right regardless, so they
   are specified as REFLECTANCE and written straight into the linear channels
   where no colour-management default can reach them. */
function linMat(reflect, rough, metal) {
  var m = new THREE.MeshStandardMaterial({ roughness: rough, metalness: metal === undefined ? 0 : metal });
  m.color.r = m.color.g = m.color.b = reflect;
  return m;
}
function linColour(m, r, g, b) { m.color.r = r; m.color.g = g; m.color.b = b; return m; }

/* ground -- neutral, with a faint 1 m grid so foot placement, stride length
   and scale can be read straight off the image.  The albedo is chosen so that
   under THIS light rig (nz-render pushes the key to ~3.15 and adds an IBL
   probe) the floor lands around 35-45% in the final image: bright enough to
   show a cast shadow, dark enough not to bloom the silhouette. */
function gridTexture() {
  var R = 256, c = document.createElement('canvas'); c.width = c.height = R;
  var g = c.getContext('2d', { willReadFrequently: true });
  /* white base: the ground's reflectance is carried by the MATERIAL colour
     (raw linear, see linMat) so it is one number and it is measurable */
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, R, R);
  g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = 2;
  g.strokeRect(1, 1, R - 2, R - 2);                 /* 1 m cell border */
  g.strokeStyle = 'rgba(0,0,0,.07)'; g.lineWidth = 1;
  for (var i = 1; i < 4; i++) {                      /* 25 cm subdivisions */
    var p = Math.round(R * i / 4) + .5;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, R); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(R, p); g.stroke();
  }
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(90, 90);                              /* one cell per metre */
  t.anisotropy = 8;
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
  return t;
}
/* A look-dev floor that is not a known reflectance is a floor whose bounce you
   cannot subtract, so this one is 18% exactly: everything the operator picks
   up from below is 18% grey light. env=level gets dirty concrete (0.14). */
var groundMat = linMat(ENVMODE === 'level' ? 0.14 : 0.18, 0.86, 0);
groundMat.map = gridTexture();
var ground = new THREE.Mesh(new THREE.PlaneGeometry(M(90), M(90), 1, 1), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
ground.name = 'critic-ground';
scene.add(ground);

/* backdrop card -- a cyc wall.  Re-placed per cell to stand directly behind
   the subject with its BOTTOM ON THE FLOOR, so the horizon line and the cast
   shadow are always in frame: "nothing floats" cannot be judged against a
   card that hides the floor. */
var backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  stdMat(ENVMODE === 'level' ? LEVEL_RIG.backdrop : 0x26282b, 0.96, 0));
backdrop.receiveShadow = true; backdrop.name = 'critic-backdrop';
scene.add(backdrop);
STAGE.backdrop = backdrop;

/* ------------------------------------------------------------ calibration --
   The measurable part of the stage.  Every prop here has a KNOWN reflectance
   so the picture can be checked against arithmetic instead of taste:

     PROBE_PATCHES  world positions + true linear albedo, sampled out of the
                    finished frame by measureCalib() and printed in the cell.
     key tab        a card whose normal points exactly AT THE KEY, i.e. cos
                    theta = 1.  This is the one number the whole rig is
                    calibrated on: albedo 0.18 in must give 0.18 out.
     camera card    the same 18% card facing the CAMERA -- the classic grey
                    card read.  With a 3:1 key:fill at 52 degrees off axis it
                    should land within a tenth of a stop of the key tab.
     spheres        chrome (environment read), 0.22-gloss (key highlight --
                    a mirror ball's highlight is a sub-pixel dot at this
                    framing and proves nothing), and 18% matte. */
var PROBE = [];      /* {name, obj, a: true linear albedo, face: cam|key|fill} */
var CALIB_KEYTAB = null, CALIB_FILLTAB = null, CALIB_BLOCKPIVOT = null;
(function buildProps() {
  var g = STAGE.props;
  /* THE PROPS STAND IN FRONT OF THE OPERATOR, not beside him.  At a 34 degree
     key the operator throws a shadow ~1.5x his own height along the ground and
     up any vertical surface behind it; with the chart at his own depth, half
     the ColorChecker and the whole grey wedge were sitting in that shadow and
     reading 0.7 stops under while the calibration tab read 1.7 over.  A
     measurement standing in the subject's shadow measures the subject, not the
     light.  1.30 m towards the lens clears it for any key elevation above ~20
     degrees, whatever the azimuth. */
  var PZ = 1.30;
  var ballR = M(0.14);                      /* 140 mm -- the standard kit ball */
  function ball(rough, metal, reflect, x, z) {
    var b = new THREE.Mesh(new THREE.SphereGeometry(ballR, 40, 28), linMat(reflect, rough, metal));
    b.castShadow = true;
    var hy = M(1.05);
    b.position.set(M(x), hy + ballR, M(z));
    var p = new THREE.Mesh(new THREE.CylinderGeometry(M(0.02), M(0.03), hy, 12), linMat(0.04, 0.7, 0.1));
    p.position.set(M(x), hy / 2, M(z)); p.castShadow = true;
    g.add(b, p);
    return b;
  }
  /* chrome for the environment read; 0.22 gloss because a MIRROR ball's key
     highlight is a sub-pixel dot at this framing and proves nothing about the
     key -- the gloss ball is the one that shows you where the light is. */
  ball(0.045, 1, 0.90, 0.72, PZ).name = 'chrome-ball';
  ball(0.22,  1, 0.75, 1.20, PZ).name = 'gloss-ball';
  var greyBall = ball(0.95, 0, 0.18, 1.68, PZ);
  greyBall.name = 'grey-ball';
  PROBE.push({ name: 'ball18', obj: greyBall, a: 0.180, face: 'cam' });

  /* grey wedge: 2%, 18%, 90% TRUE reflectance, facing the camera */
  var wedge = [0.02, 0.18, 0.90];

    if (!handled) { renderer.setRenderTarget(null); renderer.render(scene, camera); }
    renderer.shadowMap.autoUpdate = false;
    /* SwiftShader queues asynchronously in the GPU process: without a fence
       the per-frame number is submission cost, not render cost, and the whole
       bill lands on the readback instead. */
    if (FENCE) renderer.getContext().finish();
    per.push(Math.round(performance.now() - f0));
  }
  if (tag) dbg(tag + ' frames ' + per.join(','));
  return per;
}

function placeBackdrop(centre, dir, dist) {
  var d = Math.max(M(2.2), dist * 0.85);
  /* wide and tall enough to fill the frame from this distance, with the foot
     of the wall on the floor */
  var vt = Math.tan(camera.fov * Math.PI / 360);
  var hh = (dist + d) * vt * 2.6, ww = hh * camera.aspect * 1.5;
  backdrop.scale.set(ww, hh, 1);
  var p = new THREE.Vector3(centre.x, 0, centre.z).addScaledVector(
    new THREE.Vector3(dir.x, 0, dir.z).normalize(), -d);
  backdrop.position.set(p.x, hh * 0.5 - M(0.02), p.z);
  backdrop.lookAt(centre.x, backdrop.position.y, centre.z);
  backdrop.updateMatrixWorld(true);
}

/* ------------------------------------------------------- calib readout --- */
/* The numbers, on the picture, next to a swatch of what the number SHOULD
   look like.  A calibration report that lives in a console log is a
   calibration report nobody reads. */
function drawCalibReadout(cx, cy, res) {
  if (!LABELS || !res || !res.probes.length) return;
  var fs = Math.max(9, Math.round(CELL_W * 0.0135));
  var rowH = Math.round(fs * 1.5), padx = Math.round(fs * 0.7);
  var rows = res.probes.filter(function (p) { return p.face !== 'cam' || /^(2%|90%)$/.test(p.name); });
  var w = Math.round(CELL_W * 0.325), h = rowH * (rows.length + 4.4) + 10;
  var x0 = padx, y0 = Math.round(Math.max(9, CELL_W * 0.0175) * 1.75) + padx;
  s2d.save(); s2d.translate(cx, cy);
  s2d.fillStyle = 'rgba(8,10,12,.90)'; s2d.fillRect(x0, y0, w, h);
  s2d.strokeStyle = 'rgba(255,255,255,.14)'; s2d.lineWidth = 1; s2d.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
  var y = y0 + rowH;
  txt(x0 + padx, y, 'CALIBRATION  (' + res.mode + ')', '#cfe6f5', fs * 1.05, '700');
  y += rowH * 0.4;
  txt(x0 + padx, y + rowH * 0.6, 'patch   albedo  ->  measured   want', '#7f8c98', fs * 0.86, '400');
  y += rowH;
  for (var i = 0; i < rows.length; i++) {
    var p = rows[i], want = Math.round(forwardTone(p.a) * 255);
    var dev = Math.abs(p.srgb - want);
    y += rowH;
    /* measured swatch, then the ideal swatch: a two-square A/B needs no maths */
    s2d.fillStyle = 'rgb(' + p.rgb.join(',') + ')';
    s2d.fillRect(x0 + padx, y - fs, fs, fs);
    s2d.fillStyle = 'rgb(' + [want, want, want].join(',') + ')';
    s2d.fillRect(x0 + padx + fs + 2, y - fs, fs, fs);
    txt(x0 + padx + fs * 2 + 8, y - 1,
      p.name + '  ' + p.a.toFixed(3) + '  ' + (p.oblique ? 'edge-on' : p.srgb + (p.clip ? '!' : '')) + '   ' + want +
      (!p.oblique && (p.face === 'card' || p.face === 'key' || p.face === 'fill') ? '   x' + p.mul : ''),
      p.oblique ? '#7f8c98' : (dev > 12 ? '#ff8b6b' : '#c9d4dd'), fs * 0.92, p.face === 'card' ? '700' : '400');
  }
  y += rowH * 1.35;
  var bad = res.err === null || Math.abs(res.err) > CALIB.tol;
  txt(x0 + padx, y,
    res.err === null ? 'GREY CARD NOT IN FRAME' :
      (bad ? 'FAIL  ' : 'PASS  ') + (res.err > 0 ? '+' : '') + res.err + ' stop' +
      (res.wb !== undefined ? '   wb R-B ' + (res.wb > 0 ? '+' : '') + res.wb + '%' : ''),
    bad ? '#ff6b6b' : '#8ed3a4', fs * 1.05, '700');
  y += rowH;
  txt(x0 + padx, y, 'key:fill ' + (res.ratio === null ? '--' : res.ratio + ' : 1') + '   (want ' + CALIB.ratio + ' : 1)' +
    (res.keyOffAxis === null || res.keyOffAxis === undefined ? '' : '   key ' + res.keyOffAxis + ' off lens'),
    (res.ratio !== null && res.ratio >= 2.0) ? '#8ed3a4' : '#ffb44d', fs * 0.95, '700');
  s2d.restore();
}

/* world-space corners of the calibration array as it currently stands, so the
   framing follows the props instead of a hard-coded rectangle that goes stale
   the moment one of them moves */
function propCorners() {
  var b = new THREE.Box3().setFromObject(STAGE.props);
  if (b.isEmpty()) return [];
  return boxCorners(b).map(function (v) { return v.clone(); });
}

/* the stage on its own, with no operator in it */
function renderCalibOnly(spec, cx, cy, why) {
  hideAllRigs('');
  STAGE.props.visible = true;
  if (MATLAB) MATLAB.group.visible = false;
  var camAz = viewAz(spec.view);
  orientProps(camAz);
  var pts = propCorners();
  if (!pts.length) pts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(M(1), M(2), M(1))];
  var f = framePoints(pts, M(0.04), camAz, 4, { distM: 3.0, margin: 1.03 });
  placeBackdrop(f.centre, f.dir, f.dist);
  tightenShadow();
  sunKey.target.position.set(f.centre.x, f.centre.y * 0.5, f.centre.z);
  sunKey.target.updateMatrixWorld();
  sunKey.position.copy(sunKey.target.position).add(new THREE.Vector3(
    Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
    Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
    Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
  sunKey.updateMatrixWorld(true);
  renderFrames(TAA_N, 'calib');
  blitGL(cx, cy);
  try { drawCalibReadout(cx, cy, measureCalib()); } catch (err) { cwarn('calib measure failed: ' + err.message); }
  drawScaleBar(cx, cy, f);
  drawLabel(cx, cy, { title: 'LIGHT CALIBRATION (stage only)', sub: 'NO OPERATOR IN FRAME - ' + why });
  drawHeader(cx, cy);
  INFO.cells.push({ spec: spec, poseMs: 0, drawMs: 0, tier: -1, camAz: camAz, dist: +f.dist.toFixed(2) });
}

/* ==================================================== custom cell bodies == */
function txt(x, y, s, col, size, weight, align) {
  s2d.fillStyle = col || '#e8ecef';
  s2d.font = (weight || '600') + ' ' + Math.round(size || 13) + 'px "DejaVu Sans", Arial, sans-serif';
  s2d.textAlign = align || 'start'; s2d.textBaseline = 'alphabetic';
  s2d.fillText(s, x, y);
  s2d.textAlign = 'start';
}
function hideAllRigs(except) {
  for (var k in ENT) if (ENT[k].rig && ENT[k].rig.root)
    ENT[k].rig.root.visible = (except === '*' || k === except);
}
function allProbeOff() { STAGE.props.visible = false; if (MATLAB) MATLAB.group.visible = false;
  if (SCALEREF) { SCALEREF.mannequin.visible = false; SCALEREF.crate.visible = false; } }

/* ---- cell=maps : the atlas, flat, plus a cube and a sphere per region ---- */
function cellMaps(spec, cx, cy) {
  var e = getEntity(spec.kind);
  if (!e || e.__fail) { drawFail(cx, cy, 'MAPS', e && e.__fail || 'no entity'); return null; }
  drivePose(e, 'idle', 0);
  var lab = buildMatLab(e);
  var atlas = (NZ.enemies && NZ.enemies._atlas) ? NZ.enemies._atlas() : null;
  if (!atlas) cwarn('maps: NZ.enemies._atlas() returned null - the baked maps cannot be shown');

  /* --- top: the four channels, flat, at 1:1 gamma (no tone curve) --- */
  var pad = Math.round(CELL_W * 0.010);
  /* leave the header strip alone: drawHeader() paints last and was eating the
     channel titles */
  var hdrH = Math.round(Math.max(9, Math.round(CELL_W * 0.0175)) * 1.75);
  var mapH = hdrH + Math.round(CELL_H * 0.44);
  var sw = Math.floor((CELL_W - pad * 5) / 4), sh = Math.min(sw, mapH - hdrH - 30);
  s2d.save(); s2d.translate(cx, cy);
  s2d.fillStyle = '#15181b'; s2d.fillRect(0, 0, CELL_W, mapH + 10);
  var chans = [
    { key: 'map',       title: 'ALBEDO  (sRGB)',      ch: null },
    { key: 'normalMap', title: 'NORMAL  (tangent)',   ch: null },
    { key: 'orm',       title: 'ROUGHNESS  (ORM.g)',  ch: 1 },
    { key: 'orm',       title: 'AO  (ORM.r)',         ch: 0 }
  ];
  var tmp = document.createElement('canvas'), t2 = null;
  for (var i = 0; i < 4; i++) {
    var x = pad + i * (sw + pad), y = hdrH + 22;
    var img = atlas && atlas[chans[i].key];
    s2d.strokeStyle = 'rgba(255,255,255,.16)'; s2d.lineWidth = 1;
    if (img) {
      if (chans[i].ch === null) {
        s2d.imageSmoothingEnabled = true;
        s2d.drawImage(img, 0, 0, img.width, img.height, x, y, sw, sh);
      } else {
        /* split one channel out of the packed ORM so roughness and AO can be
           looked at as the greyscales they are, not guessed at from a
           red/green mush */
        if (tmp.width !== img.width) { tmp.width = img.width; tmp.height = img.height; t2 = tmp.getContext('2d', { willReadFrequently: true }); }
        t2.drawImage(img, 0, 0);
        var id = t2.getImageData(0, 0, img.width, img.height), d = id.data, c = chans[i].ch;
        for (var p = 0; p < d.length; p += 4) { var v = d[p + c]; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }
        t2.putImageData(id, 0, 0);
        s2d.drawImage(tmp, 0, 0, img.width, img.height, x, y, sw, sh);
      }
    } else {
      s2d.fillStyle = '#2a0d0d'; s2d.fillRect(x, y, sw, sh);
      txt(x + sw / 2, y + sh / 2, 'NOT BAKED', '#ff6b6b', 15, '700', 'center');
    }
    s2d.strokeRect(x + .5, y + .5, sw - 1, sh - 1);
    txt(x, y - 8, chans[i].title, '#c8d2da', Math.max(11, CELL_W * 0.011), '700');
    /* 4x4 tile grid with names: an atlas you cannot navigate is an atlas you
       cannot fix */
    s2d.strokeStyle = 'rgba(120,200,255,.32)';
    for (var t = 1; t < 4; t++) {
      s2d.beginPath(); s2d.moveTo(x + sw * t / 4, y); s2d.lineTo(x + sw * t / 4, y + sh); s2d.stroke();
      s2d.beginPath(); s2d.moveTo(x, y + sh * t / 4); s2d.lineTo(x + sw, y + sh * t / 4); s2d.stroke();
    }
    if (i === 0) {
      var TN = ['skin', 'cloth', 'nylon', 'leather', 'plastic', 'rubber', 'steel', 'painted',
                'gunmetal', 'camo', 'scrim', 'knit', 'trim', 'lens', 'web', 'wound'];
      for (t = 0; t < 16; t++)
        txt(x + (t % 4) * sw / 4 + 3, y + ((t / 4) | 0) * sh / 4 + 12, TN[t], 'rgba(190,235,255,.9)', Math.max(8, CELL_W * 0.0072), '700');
    }
  }
  s2d.restore();

  /* --- bottom: the same materials on real geometry --- */
  var gy = mapH + 14, gh = CELL_H - gy - Math.round(CELL_W * 0.026 * 2.5);
  var res = null;
  if (lab) {
    hideAllRigs(''); allProbeOff();
    lab.group.visible = true;
    setRenderSize(Math.min(1400, CELL_W), Math.max(120, gh));
    var pts = [];
    for (var q = 0; q < lab.items.length; q++) {
      pts.push(new THREE.Vector3(lab.items[q].x, lab.items[q].y, 0));
    }
    pts.push(new THREE.Vector3(-M(1.30), M(0.04), 0), new THREE.Vector3(M(1.30), M(0.72), 0));
    /* straight on: an oblique row of spheres compares foreshortening, not
       material.  The key is still 52 degrees off this axis (KEY_AZ is fixed
       for the whole run and derived from exactly this camera). */
    var f = framePoints(pts, M(0.10), viewAz(spec.view), 4, { distM: 4.2, margin: 1.02 });
    placeBackdrop(f.centre, f.dir, f.dist * 3);
    backdrop.visible = false;
    tightenShadow();
    sunKey.target.position.copy(f.centre); sunKey.target.updateMatrixWorld();
    sunKey.position.copy(f.centre).add(new THREE.Vector3(
      Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
      Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
      Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
    sunKey.updateMatrixWorld(true);
    renderFrames(TAA_N, 'maps');
    blitGL(cx, cy + gy, CELL_W, gh);
    /* label each pair where it actually landed on screen */
    s2d.save(); s2d.translate(cx, cy + gy);
    for (q = 0; q < lab.items.length; q++) {
      var it = lab.items[q];
      var pv = new THREE.Vector3(it.x, it.y - M(0.115), 0).project(camera);
      var px2 = (pv.x * 0.5 + 0.5) * CELL_W, py2 = (1 - (pv.y * 0.5 + 0.5)) * gh;
      if (px2 < 0 || px2 > CELL_W || py2 < 0 || py2 > gh) continue;
      s2d.fillStyle = 'rgba(8,10,12,.72)';
      var fw = Math.max(46, CELL_W * 0.052);
      s2d.fillRect(px2 - fw / 2, py2 + 2, fw, 15);
      txt(px2, py2 + 13, it.name, '#dfe7ee', Math.max(9, CELL_W * 0.0092), '700', 'center');
    }
    s2d.restore();
    lab.group.visible = false;
    backdrop.visible = true;
    setRenderSize(BASE_W, BASE_H);
    res = { n: lab.items.length };
  } else {
    drawFail(cx, cy + gy, 'MATERIAL LAB', 'no operator material / no atlas regions');
  }
  return { sub: 'atlas 1024x1024, 16 tiles  |  ' + (res ? res.n : 0) + ' regions on chamfered cube + sphere' +
    '  |  maps drawn flat, no tone curve' };
}

/* ---- cell=roster : four operators, one light, one lens, one frame -------- */
function cellRoster(spec, cx, cy) {
  var pts = [], ok = [], i, e;
  var camAz = viewAz(spec.view);
  var B = camBasis(camAz, 5);
  allProbeOff();
  for (i = 0; i < KINDS.length; i++) {
    e = getEntity(KINDS[i]);
    if (!e || e.__fail) { cwarn('roster: ' + KINDS[i] + ' unavailable (' + (e && e.__fail) + ')'); continue; }
    drivePose(e, spec.pose === 'full' ? 'aim' : spec.pose, camAz);
    if (!charOf(e)) { cwarn('roster: ' + KINDS[i] + ' has no SkinnedMesh at this tier'); continue; }
    ok.push(e);
  }
  if (!ok.length) { drawFail(cx, cy, 'ROSTER', 'no operator could be posed'); return null; }
  /* laid out along the CAMERA RIGHT axis, not world X: every operator is then
     the same distance from the lens and the comparison is honest */
  var gap = M(1.30), x0 = -(ok.length - 1) / 2;
  for (i = 0; i < ok.length; i++) {
    var off = (x0 + i) * gap;
    ok[i].rig.root.position.addScaledVector(B.right, off);
    ok[i].rig.root.updateMatrixWorld(true);
    ok[i].__rosterOff = off;
    var sk = charOf(ok[i]); if (sk) { sk.castShadow = sk.receiveShadow = true; sk.frustumCulled = false; }
    var pr = pointsOfRig(ok[i]);
    if (pr) pts = pts.concat(pr);
  }
  hideAllRigs('*');
  var cd = CELLS.roster;
  var f = framePoints(pts, M(0.16), camAz, cd.elev, { distM: cd.distM, margin: cd.margin });
  placeBackdrop(f.centre, f.dir, f.dist);
  tightenShadow();
  var scam = sunKey.shadow.camera, ext = M(3.6) + gap * ok.length * 0.5;
  scam.left = -ext; scam.right = ext; scam.top = ext; scam.bottom = -ext; scam.updateProjectionMatrix();
  sunKey.target.position.set(f.centre.x, f.centre.y * 0.5, f.centre.z);
  sunKey.target.updateMatrixWorld();
  sunKey.position.copy(sunKey.target.position).add(new THREE.Vector3(
    Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
    Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
    Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
  sunKey.updateMatrixWorld(true);
  renderFrames(TAA_N, 'roster');
  blitGL(cx, cy);
  /* burn each operator's name under its own feet */
  s2d.save(); s2d.translate(cx, cy);
  for (i = 0; i < ok.length; i++) {
    var base = new THREE.Vector3().addScaledVector(B.right, ok[i].__rosterOff).project(camera);
    var bx = (base.x * 0.5 + 0.5) * CELL_W, by = (1 - (base.y * 0.5 + 0.5)) * CELL_H;
    var fs2 = Math.max(12, CELL_W * 0.0165);
    s2d.fillStyle = 'rgba(8,10,12,.74)';
    s2d.fillRect(bx - CELL_W * 0.085, by + 4, CELL_W * 0.17, fs2 * 2.5);
    txt(bx, by + 4 + fs2 * 1.05, DISPLAY[ok[i].kind] || ok[i].kind, '#e8ecef', fs2, '700', 'center');
    txt(bx, by + 4 + fs2 * 2.15, ok[i].kind + '  ' + (ok[i].cfg.h / SCALE).toFixed(2) + ' m', '#93a0ab', fs2 * 0.78, '400', 'center');
    /* put them back where they were so the next cell is not shifted */
    ok[i].rig.root.position.addScaledVector(B.right, -ok[i].__rosterOff);
  }
  s2d.restore();
  /* no scale bar: it lands on top of the fourth operator's name plate, and the
     1 m floor grid already carries the scale */
  return { sub: ok.length + ' operators  |  identical key/lens/standoff  |  gap ' +
    (gap / SCALE).toFixed(2) + ' m  |  floor grid 1 m  |  pose ' +
    (spec.pose === 'full' ? 'aim' : spec.pose) };
}

/* ---- cell=anim : N phases of one continuous cycle, in a row -------------- */
function cellAnim(spec, cx, cy) {
  var e = getEntity(spec.kind);
  if (!e || e.__fail) { drawFail(cx, cy, 'ANIM', e && e.__fail || 'no entity'); return null; }
  var pose = (spec.pose === 'full' || spec.pose === 'aim') ? 'walk' : spec.pose;
  var N = FRAMES_N;
  var camAz = viewAz(spec.view);
  var cd = CELLS.anim;
  var labH = Math.round(CELL_W * 0.026 * 2.5);
  var stripH = CELL_H - labH - Math.round(Math.max(9, CELL_W * 0.0175) * 1.75);
  var telH = Math.round(stripH * 0.20);
  var frameH = stripH - telH, frameW = Math.floor(CELL_W / N);
  var y0 = Math.round(Math.max(9, CELL_W * 0.0175) * 1.75);
  allProbeOff(); hideAllRigs(spec.kind);

  /* settle the cycle once, then walk it forward -- one continuous stride */
  drivePose(e, pose, camAz, { phase: 0.0 });
  var sk = charOf(e);
  if (!sk) { drawFail(cx, cy, 'ANIM', 'no SkinnedMesh at this LOD tier'); return null; }
  sk.castShadow = sk.receiveShadow = true; sk.frustumCulled = false;

  /* frame ONCE off the settled pose so every strip frame shares a camera:
     a per-frame refit would rescale the operator and hide exactly the vertical
     travel the strip exists to show */
  setRenderSize(frameW, frameH);
  var f = framePoints(pointsOfRig(e), M(0.16), camAz, cd.elev, { distM: cd.distM, margin: cd.margin });
  placeBackdrop(f.centre, f.dir, f.dist);
  tightenShadow();
  sunKey.target.position.set(f.centre.x, f.centre.y * 0.5, f.centre.z);
  sunKey.target.updateMatrixWorld();
  sunKey.position.copy(sunKey.target.position).add(new THREE.Vector3(
    Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
    Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
    Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
  sunKey.updateMatrixWorld(true);
  var camSave = { p: camera.position.clone(), q: camera.quaternion.clone(), fov: camera.fov };

  var tel = [], gY = null;
  for (var i = 0; i < N; i++) {
    if (i > 0) drivePose(e, pose, camAz, { phase: i / N, noReset: true, frames: 1 });
    camera.position.copy(camSave.p); camera.quaternion.copy(camSave.q);
    camera.fov = camSave.fov; camera.aspect = RW / RH; camera.updateProjectionMatrix();
    renderFrames(TAA_N, 'anim' + i);
    blitGL(cx + i * frameW, cy + y0, frameW, frameH);
    /* telemetry, in the WORLD frame: drivePose re-centres the root by e.x, so
       a foot's true world position is its drawn position plus the travel. A
       planted foot must not move in this column. */
    var fl = boneWorld(e, 'footL'), fr = boneWorld(e, 'footR');
    var rec = { i: i, phase: i / N, x: e.x,
      lY: fl ? fl.y : null, rY: fr ? fr.y : null,
      lX: fl ? fl.z + e.z : null, rX: fr ? fr.z + e.z : null };
    tel.push(rec);
    if (gY === null) {
      var g0 = new THREE.Vector3(f.centre.x, 0, f.centre.z).project(camera);
      gY = (1 - (g0.y * 0.5 + 0.5)) * frameH;
    }
  }
  setRenderSize(BASE_W, BASE_H);

  /* per-frame overlay: ground line, phase, and the two numbers that decide
     whether the legs dangle */
  s2d.save(); s2d.translate(cx, cy);
  for (i = 0; i < N; i++) {
    var fx = i * frameW;
    s2d.strokeStyle = 'rgba(255,255,255,.10)'; s2d.lineWidth = 1;
    s2d.beginPath(); s2d.moveTo(fx + .5, y0); s2d.lineTo(fx + .5, y0 + frameH); s2d.stroke();
    if (gY !== null && gY > 0 && gY < frameH) {
      s2d.strokeStyle = 'rgba(110,220,255,.55)'; s2d.setLineDash([4, 4]);
      s2d.beginPath(); s2d.moveTo(fx, y0 + gY); s2d.lineTo(fx + frameW, y0 + gY); s2d.stroke();
      s2d.setLineDash([]);
    }
    txt(fx + 5, y0 + 15, 'p' + Math.round(tel[i].phase * 100) + '%', '#cfe6f5', Math.max(10, frameW * 0.075), '700');
  }
  /* telemetry band */
  var ty = y0 + frameH;
  s2d.fillStyle = 'rgba(10,13,16,.94)'; s2d.fillRect(0, ty, CELL_W, telH);
  s2d.strokeStyle = 'rgba(255,255,255,.10)';
  s2d.beginPath(); s2d.moveTo(0, ty + .5); s2d.lineTo(CELL_W, ty + .5); s2d.stroke();
  var fs3 = Math.max(8, Math.min(13, frameW * 0.072));
  var worstSlip = 0, worstFloat = 0;
  for (i = 0; i < N; i++) {
    var t0 = tel[i], tp = tel[(i - 1 + N) % N];
    var dL = (i === 0 || t0.lX === null || tp.lX === null) ? null : Math.abs(t0.lX - tp.lX) / SCALE * 1000;
    var dR = (i === 0 || t0.rX === null || tp.rX === null) ? null : Math.abs(t0.rX - tp.rX) / SCALE * 1000;
    var hL = t0.lY === null ? null : t0.lY / SCALE * 1000, hR = t0.rY === null ? null : t0.rY / SCALE * 1000;
    /* whichever foot moved less this step is the one in stance: that is the
       one whose slip is a defect */
    var stanceL = (dL !== null && dR !== null) ? (dL < dR) : true;
    var slip = stanceL ? dL : dR;
    if (slip !== null && slip > worstSlip) worstSlip = slip;
    var lo = Math.min(hL === null ? 1e9 : hL, hR === null ? 1e9 : hR);
    if (lo < 1e9) worstFloat = Math.max(worstFloat, Math.abs(lo));
    var xx = i * frameW + 5;
    txt(xx, ty + fs3 * 1.3, 'ankle L' + (hL === null ? '--' : Math.round(hL)) + ' R' + (hR === null ? '--' : Math.round(hR)),
      '#93a0ab', fs3, '400');
    txt(xx, ty + fs3 * 2.5, 'stance ' + (stanceL ? 'L' : 'R') + ' slip ' + (slip === null ? '--' : Math.round(slip)) + 'mm',
      slip !== null && slip > 12 ? '#ff8b6b' : '#8ed3a4', fs3, '700');
  }
  s2d.restore();
  /* no scale bar: it sits on top of the last two telemetry columns */
  return { tel: tel,
    sub: pose + ' cycle, ' + N + ' phases  |  worst stance-foot slip ' + Math.round(worstSlip) +
      ' mm per 1/' + N + ' cycle  |  lowest ankle ' + Math.round(worstFloat) +
      ' mm  |  dashed line = world y=0' };
}

/* ---- cell=scale : operator vs a 1.83 m mannequin and a 1.20 m crate ------ */
function cellScale(spec, cx, cy) {
  var e = getEntity(spec.kind);
  if (!e || e.__fail) { drawFail(cx, cy, 'SCALE', e && e.__fail || 'no entity'); return null; }
  var camAz = viewAz(spec.view);
  drivePose(e, spec.pose === 'full' ? 'idle' : spec.pose, camAz);
  var sk = charOf(e);
  if (!sk) { drawFail(cx, cy, 'SCALE', 'no SkinnedMesh at this LOD tier'); return null; }
  sk.castShadow = sk.receiveShadow = true; sk.frustumCulled = false;
  hideAllRigs(spec.kind); allProbeOff();
  var S = buildScaleRef();
  var cd = CELLS.scale, B = camBasis(camAz, cd.elev);
  var mOff = M(1.15), cOff = M(-1.30);
  S.mannequin.position.set(0, 0, 0).addScaledVector(B.right, mOff);
  S.crate.position.set(0, 0, 0).addScaledVector(B.right, cOff);
  S.mannequin.rotation.y = camAz * Math.PI / 180;
  /* turned AWAY from the frame centre so the near vertical edge and both
     faces read: a cube seen dead-on is indistinguishable from a flat card */
  S.crate.rotation.y = camAz * Math.PI / 180 - 0.55;
  S.mannequin.visible = S.crate.visible = true;
  S.mannequin.updateMatrixWorld(true); S.crate.updateMatrixWorld(true);
  var pts = pointsOfRig(e) || [];
  pts = pts.concat([
    new THREE.Vector3().addScaledVector(B.right, mOff).setY(0),
    new THREE.Vector3().addScaledVector(B.right, mOff).setY(M(1.83)),
    new THREE.Vector3().addScaledVector(B.right, cOff).setY(0),
    new THREE.Vector3().addScaledVector(B.right, cOff).setY(M(1.20))]);
  var f = framePoints(pts, M(0.18), camAz, cd.elev, { distM: cd.distM, margin: cd.margin });
  placeBackdrop(f.centre, f.dir, f.dist);
  tightenShadow();
  var scam = sunKey.shadow.camera, ext = M(4.6);
  scam.left = -ext; scam.right = ext; scam.top = ext; scam.bottom = -ext; scam.updateProjectionMatrix();
  sunKey.target.position.set(f.centre.x, f.centre.y * 0.5, f.centre.z);
  sunKey.target.updateMatrixWorld();
  sunKey.position.copy(sunKey.target.position).add(new THREE.Vector3(
    Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
    Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
    Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
  sunKey.updateMatrixWorld(true);
  renderFrames(TAA_N, 'scale');
  blitGL(cx, cy);

  /* Horizontal rules at every 0.5 m, projected from the world.
     They are drawn at the MANNEQUIN's depth, not at the framing centre's: the
     framing centre sits at the mid-depth of the whole cloud (the crate is
     1.2 m deep and turned 16 degrees), and a rule drawn a few units nearer the
     lens than the thing it is measuring reads about 40 mm high at this
     standoff -- enough to make a correct 1.83 m mannequin look short, which is
     precisely the error this cell exists to catch. */
  s2d.save(); s2d.translate(cx, cy);
  var refP = new THREE.Vector3().addScaledVector(B.right, mOff);
  var atY = function (metres) {
    var p = new THREE.Vector3(refP.x, M(metres), refP.z).project(camera);
    return (1 - (p.y * 0.5 + 0.5)) * CELL_H;
  };
  /* The operator's REAL stature: the top of the SKINNED SILHOUETTE, measured
     by running the skinning on the actual vertices.  Not ECFG (that is the
     number someone typed), not the head bone (that is inside the skull), not
     headWorld() (that is the headshot capsule, which stops well below the
     helmet).  This is the number a player's eye reads. */
  var mh = measuredExtent(e);
  var crownM = mh ? (mh.top - mh.low) / SCALE : null;
  var crownMode = mh ? mh.mode : '?';
  for (var mtr = 0.5; mtr <= 2.0001; mtr += 0.5) {
    var yy = atY(mtr); if (!(yy > 12 && yy < CELL_H - 12)) continue;
    s2d.strokeStyle = mtr === 1.83 ? 'rgba(255,200,90,.55)' : 'rgba(120,200,255,.30)';
    s2d.setLineDash([5, 5]); s2d.lineWidth = 1;
    s2d.beginPath(); s2d.moveTo(0, yy + .5); s2d.lineTo(CELL_W, yy + .5); s2d.stroke();
    s2d.setLineDash([]);
    txt(4, yy - 4, mtr.toFixed(1) + ' m', 'rgba(190,230,255,.9)', Math.max(10, CELL_W * 0.014), '700');
  }
  var y183 = atY(1.83);
  s2d.strokeStyle = 'rgba(255,200,90,.75)'; s2d.lineWidth = 2;
  s2d.beginPath(); s2d.moveTo(0, y183 + .5); s2d.lineTo(CELL_W, y183 + .5); s2d.stroke();
  txt(CELL_W - 6, y183 - 5, '1.83 m  (mannequin crown)', '#ffcf6a', Math.max(10, CELL_W * 0.014), '700', 'right');
  if (crownM !== null) {
    var yc = atY(crownM);
    s2d.strokeStyle = 'rgba(120,255,160,.85)'; s2d.lineWidth = 2;
    s2d.setLineDash([9, 5]);
    s2d.beginPath(); s2d.moveTo(0, yc + .5); s2d.lineTo(CELL_W * 0.62, yc + .5); s2d.stroke();
    s2d.setLineDash([]);
    txt(6, yc + (Math.abs(yc - y183) < 16 ? 16 : -5),
      'operator ' + crownM.toFixed(2) + ' m (' + crownMode + ')', '#7cffa0', Math.max(10, CELL_W * 0.014), '700');
  }
  s2d.restore();
  S.mannequin.visible = S.crate.visible = false;
  var dev = crownM === null ? null : ((crownM - e.cfg.h / SCALE) / (e.cfg.h / SCALE) * 100);
  return { f: f, sub: 'ECFG nominal ' + (e.cfg.h / SCALE).toFixed(2) + ' m (h=' + e.cfg.h.toFixed(1) + 'u)  |  measured ' +
    (crownM === null ? '?' : crownM.toFixed(2) + ' m (' + (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%, ' + crownMode + ')') +
    '  |  mannequin 1.83 m  |  crate 1.20 m  |  floor grid 1 m' };
}

function renderCell(spec, slot) {
  var cx = (slot % COLS) * CELL_W, cy = Math.floor(slot / COLS) * CELL_H;
  var cd = CELLS[spec.cell] || CELLS.full;

  /* ---- composite cells own their whole frame ---- */
  if (cd.custom) {
    var head0 = (DISPLAY[spec.kind] || spec.kind.toUpperCase());
    var title0 = { maps: 'MATERIAL / TEXTURE INSPECTION', roster: 'ROSTER - all four operators',
                   anim: head0 + ' - animation strip', scale: head0 + ' - scale reference' }[cd.custom];
    var t0c = performance.now(), out = null;
    try {
      out = cd.custom === 'maps' ? cellMaps(spec, cx, cy)
          : cd.custom === 'roster' ? cellRoster(spec, cx, cy)
          : cd.custom === 'anim' ? cellAnim(spec, cx, cy)
          : cellScale(spec, cx, cy);
    } catch (err) {
      setRenderSize(BASE_W, BASE_H);
      drawFail(cx, cy, title0, 'cell threw: ' + (err && err.message));
      cwarn(cd.custom + ' threw: ' + (err && err.stack || err));
    }
    if (out) {
      drawGuides(cx, cy);
      if (out.f) drawScaleBar(cx, cy, out.f);
      drawLabel(cx, cy, { title: title0, sub: out.sub || '' });
    }
    drawHeader(cx, cy);
    INFO.cells.push({ spec: spec, poseMs: 0, drawMs: Math.round(performance.now() - t0c), tier: 0, camAz: 0, dist: 0 });
    if (out && out.tel) INFO.anim = out.tel;
    return;
  }

  var e = getEntity(spec.kind);
  var head = (DISPLAY[spec.kind] || spec.kind.toUpperCase());
  var title = head + ' - ' + spec.pose + ' - ' + spec.cell;
  /* The calibration cell measures the LIGHT.  It must keep working when the
     rig module is broken -- that is exactly when someone needs to know whether
     the stage is still trustworthy -- so it falls back to the bare stage and
     says so on the picture rather than throwing the whole cell away. */
  if (cd.props && (!e || e.__fail)) { renderCalibOnly(spec, cx, cy, e && e.__fail || 'no entity'); return; }
  if (!e) { drawFail(cx, cy, title, 'ECFG has no kind "' + spec.kind + '"'); return; }
  if (e.__fail) { drawFail(cx, cy, title, e.__fail); return; }

  var az = viewAz(spec.view);
  var t0 = performance.now();
  dbg('pose:begin ' + spec.kind + '/' + spec.pose);
  drivePose(e, spec.pose, az);
  var tPose = performance.now() - t0;
  dbg('pose:end ' + Math.round(tPose) + 'ms');
  if (e.__fail) { drawFail(cx, cy, title, e.__fail); return; }

  var sk = charOf(e);
  if (!sk) {
    drawFail(cx, cy, title, 'no SkinnedMesh under the rig root - the actor is on the far/instanced LOD tier ' +
      '(tier=' + (e._nz ? e._nz.tier : '?') + '). Nothing to critique at this range.');
    return;
  }
  sk.castShadow = true; sk.receiveShadow = true;
  sk.frustumCulled = false;

  /* visibility: exactly one operator per cell */
  for (var k in ENT) if (ENT[k].rig && ENT[k].rig.root) ENT[k].rig.root.visible = (k === spec.kind);
  STAGE.props.visible = !!cd.props;

  /* what exactly are we pointing at */
  var pts = null, pad = M(cd.pad || 0.10), wm = null;
  if (cd.weapon) {
    wm = weaponMesh(e);
    if (wm) {
      if (!wm.parent) scene.add(wm);
      wm.visible = true;
      wm.userData.rebuild();
      pts = pointsOfMesh(wm, 5);
      pad = M(0.02);
      e.rig.root.visible = false;         /* the gun really is alone */
    } else {
      pts = pointsOfBones(e, ['handL', 'handR', 'fingL', 'fingR']);
      pad = M(0.55);
      if (!pts) pts = pointsOfRig(e);
    }
  } else if (cd.bones) {
    pts = pointsOfBones(e, cd.bones);
    if (!pts) { pts = pointsOfRig(e); pad = M(0.10); cwarn(spec.cell + ': no named bones resolved, fell back to whole-rig framing'); }
  } else {
    pts = pointsOfRig(e);
    pad = M(0.10);
    if (cd.props) {
      /* Frame the ARRAY, not the operator.  A patch that lands 20 px wide
         cannot be sampled: the readback window, the chromatic aberration and
         the sharpen kernel all reach across into the next patch, which is how
         a 1% black chip came back reading 9x its own albedo.  The operator
         stands behind the array and is deliberately the smaller subject here --
         this cell exists to measure the light, not to look at him. */
      orientProps(az);
      pts = propCorners();
      pad = M(0.04);
    }
  }
  if (!pts) { drawFail(cx, cy, title, 'nothing to frame: neither bones nor rig geometry could be located'); return; }
  if (WEP_CACHE[spec.kind] && !cd.weapon && WEP_CACHE[spec.kind].parent) WEP_CACHE[spec.kind].visible = false;

  var camAz;
  if (cd.azMode === 'weapon')    camAz = weaponAzimuth(e, az) + (cd.azRel || 0);
  else if (cd.azMode === 'body') camAz = e.face * 180 / Math.PI + (cd.azRel || 0);
  else                           camAz = az + (cd.azRel || 0);
  var f = framePoints(pts, pad, camAz, spec.view === 'top' ? 74 : (cd.elev || 0),
    { distM: cd.distM, margin: cd.margin, fov: cd.fov });
  placeBackdrop(f.centre, f.dir, f.dist);
  tightenShadow();
  /* keep the shadow frustum over the SUBJECT, not the world origin */
  sunKey.target.position.set(f.centre.x, f.centre.y * 0.5, f.centre.z);
  sunKey.target.updateMatrixWorld();
  sunKey.position.copy(sunKey.target.position).add(new THREE.Vector3(
    Math.sin(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D,
    Math.sin(KEY_EL * Math.PI / 180) * SUN_D,
    Math.cos(KEY_AZ * Math.PI / 180) * Math.cos(KEY_EL * Math.PI / 180) * SUN_D));
  sunKey.updateMatrixWorld(true);

  /* Silhouette read (CS2-BRIEF: "an object reads as real from its outline
     before any texture loads").  scene.overrideMaterial would flatten the
     BACKDROP too and hand back a black rectangle, so only the character is
     swapped and the wall is lit flat behind it. */
  var silSave = null;
  if (cd.silhouette) {
    silSave = { mat: sk.material, bd: backdrop.material, gd: ground.material };
    sk.material = SIL_DARK;
    backdrop.material = SIL_LIGHT;
    ground.material = SIL_LIGHT;      /* flat, not hidden: a hidden floor
                                         leaves the void below the horizon */
    if (wm) wm.material = SIL_DARK;
  }
  var t1 = performance.now();
  dbg('draw:begin ' + TAA_N + ' frames @' + RW + 'x' + RH);
  renderFrames(TAA_N, 'draw');
  var tDraw = performance.now() - t1;
  dbg('draw:end ' + Math.round(tDraw) + 'ms');
  if (silSave) {
    sk.material = silSave.mat; backdrop.material = silSave.bd; ground.material = silSave.gd;
    if (wm) wm.material = silSave.mat;
  }

  /* blit + downsample */
  blitGL(cx, cy);
  dbg('blit:end');
  /* the calibration cell is the only one that reads its own pixels back and
     grades itself; do it before the overlays so nothing painted on top of the
     frame can be sampled by mistake */
  if (cd.props) { try { drawCalibReadout(cx, cy, measureCalib()); } catch (err) { cwarn('calib measure failed: ' + err.message); } }
  drawGuides(cx, cy);

  var st = e._nz || {};
  var sub = KIT[spec.kind] + '  |  view ' + spec.view + ' az' + Math.round(camAz) + '°' +
    '  fov' + Math.round(camera.fov) + '  q=' + ((NZ.render && NZ.render.quality) || 'n/a') +
    '  lod' + (st.tier === undefined ? '?' : st.tier) +
    '  h=' + (e.cfg.h).toFixed(1) + 'u/' + (e.cfg.h / SCALE).toFixed(2) + 'm';
  if (wm) {
    var oal = longestChord(pts), smm = WEAPON_SPEC_MM[spec.kind] || 0;
    var mm = oal / SCALE * 1000, dev = smm ? ((mm - smm) / smm * 100) : 0;
    sub += '  |  OAL ' + oal.toFixed(2) + 'u = ' + Math.round(mm) + 'mm' +
      (smm ? ' (spec ' + smm + ', ' + (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%)' : '') +
      '  ' + wm.userData.tris + ' tris';
    INFO.oal = { kind: spec.kind, units: +oal.toFixed(3), mm: Math.round(mm), specMM: smm, devPct: +dev.toFixed(1) };
  }
  dbg('label:begin');
  drawScaleBar(cx, cy, f);
  drawLabel(cx, cy, { title: title, sub: sub });
  drawHeader(cx, cy);
  dbg('label:end');
  INFO.cells.push({ spec: spec, poseMs: Math.round(tPose), drawMs: Math.round(tDraw), tier: st.tier, camAz: camAz, dist: +f.dist.toFixed(2) });
}

/* =============================================================== the run */
/* Cells are published ONE AT A TIME.  The runner has a hard 40 s wall and a
   sheet can easily want more than that, so every finished cell is exposed as
   its own PNG and announced through document.title the moment it is done.
   A caller that runs out of budget half way through still keeps everything
   that completed, and re-running skips it. */
var CELLPNG = [];
var cellCanvas = null, cell2d = null;
function publishCell(i) {
  var cx = (i % COLS) * CELL_W, cy = Math.floor(i / COLS) * CELL_H;
  if (!cellCanvas) {
    cellCanvas = document.createElement('canvas');
    cellCanvas.width = CELL_W; cellCanvas.height = CELL_H;
    cell2d = cellCanvas.getContext('2d', { willReadFrequently: true });
  }
  cell2d.putImageData(s2d.getImageData(cx, cy, CELL_W, CELL_H), 0, 0);
  CELLPNG[i] = cellCanvas.toDataURL('image/png');
  window.__criticCellPNG = function (k) { return CELLPNG[k] || null; };
  document.title = 'CRITIC CELL ' + (i + 1) + '/' + PLAN.length;
}

var stepI = 0, cellCost = 0;
function step() {
  if (stepI >= PLAN.length) { finish(); return; }
  if (DEADLINE && stepI > 0) {
    var elapsed = performance.now() - T.t0;
    if (elapsed + cellCost * 1.12 > DEADLINE) {
      INFO.stoppedEarly = 'deadline: ' + Math.round(elapsed) + 'ms used, a cell costs ~' +
        Math.round(cellCost) + 'ms, limit ' + DEADLINE + 'ms';
      dbg(INFO.stoppedEarly);
      finish(); return;
    }
  }
  var tCell = performance.now();
  var spec = PLAN[stepI];
  try { renderCell(spec, stepI); }
  catch (err) {
    drawFail((stepI % COLS) * CELL_W, Math.floor(stepI / COLS) * CELL_H,
      spec.kind + ' / ' + spec.cell, 'harness threw: ' + (err && err.message));
    cwarn('cell ' + stepI + ' threw: ' + (err && err.stack || err));
  }
  publishCell(stepI);
  cellCost = Math.max(cellCost, performance.now() - tCell);
  stepI++;
  requestAnimationFrame(step);
}

function finish() {
  dbg('finish:begin');
  INFO.timing.marks = T.marks.map(function (m) { return m[0] + '=' + Math.round(m[1]) + 'ms'; });
  INFO.timing.totalMs = Math.round(performance.now() - T.t0);
  try { INFO.rig = NZ.enemies && NZ.enemies.stats ? NZ.enemies.stats() : null; } catch (e) { INFO.rig = null; }
  try { INFO.render = NZ.render ? { quality: NZ.render.quality, effects: NZ.render.effects } : null; } catch (e) {}
  INFO.plan = PLAN;
  INFO.rendered = stepI;
  window.__criticInfo = INFO;
  window.__criticPNG = function () { return sheet.toDataURL('image/png'); };
  window.__criticCellPNG = function (k) { return CELLPNG[k] || null; };
  document.title = 'CRITIC READY';
  try { console.log('[critic] ' + JSON.stringify(INFO.timing)); } catch (e) {}
  if (CRITIC_WARN.length) try { console.log('[critic] warnings: ' + CRITIC_WARN.join(' || ')); } catch (e) {}
}

/* one warm frame so shaders compile and nz-render allocates its targets
   before the first cell is timed */
window.__mark('setup');
requestAnimationFrame(function () {
  camera.position.set(0, M(1.6), M(6));
  camera.lookAt(0, M(1.0), 0);
  renderFrames(1);
  window.__mark('warm');
  requestAnimationFrame(step);
});

})();
</script>
</body>
</html>
