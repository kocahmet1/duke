<title>SHOT LAUNCHER &mdash; ENEMIES</title>
<!--
  ENEMY CONTACT SHEET
  -------------------
  Double-click this file. No query string, no clicks.

  Every enemy type gets two cells:
    "<kind> LOD"     three instances of the same creature at 8 / 19 / 36 m in
                     one frame, so close, mid and far read side by side.
    "<kind> action"  a held mid-attack pose (arms up, muzzle tell lit).
  Cell 9 lines all four kinds up at one distance as a scale reference.

  The level's own spawns are removed, the AI is blinded so nothing walks into
  frame, and a neutral key/rim/hemi rig is added over the staging area so the
  creature art is judged on its own rather than on the level's night lighting.

  Wait for the tab title to read "SHOT READY", then screenshot.
-->
<meta http-equiv="refresh" content="2;url=NUKEM.html?shot=enemies&amp;mode=grid&amp;width=1920&amp;height=1080&amp;ss=2&amp;warm=16&amp;settle=16&amp;prewarm=60&amp;fov=55&amp;lights=1&amp;hud=0">
<script>
  window.NZ_SHOT = {
    scene: 'enemies', mode: 'grid',
    width: 1920, height: 1080, ss: 2,
    warm: 16, settle: 16, prewarm: 60, fov: 55, lights: true, hud: false
  };
  location.replace('NUKEM.html?shot=enemies&mode=grid&width=1920&height=1080' +
                   '&ss=2&warm=16&settle=16&prewarm=60&fov=55&lights=1&hud=0');
</script>
<style>
  html,body{margin:0;height:100%;background:#08090b;color:#d8a018;

  a{color:#8fb8ff}
</style>
</head>
