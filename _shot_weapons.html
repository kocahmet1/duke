<!DOCTYPE html>

<meta charset="utf-8">
<title>SHOT LAUNCHER &mdash; WEAPONS</title>
<!--
  WEAPON VIEWMODEL CONTACT SHEET
  ------------------------------
  Double-click this file. No query string, no clicks.

  4 weapons x 4 states = 16 cells on a 1920x1080 sheet:
    row 1  PISTOL    idle / ADS / mid-reload / muzzle flash
    row 2  SHOTGUN   "
    row 3  CHAINGUN  "
    row 4  RPG       "

  The muzzle-flash cell fires a single round on the second-to-last warm frame
  and freezes one frame later, so the flash, the ejected case and the first
  smoke puff are all still alive in the held frame.

  Wait for the tab title to read "SHOT READY", then screenshot.
-->
<meta http-equiv="refresh" content="2;url=NUKEM.html?shot=weapons&amp;mode=grid&amp;width=1920&amp;height=1080&amp;ss=2&amp;warm=12&amp;settle=14&amp;prewarm=60&amp;fov=60&amp;lights=0&amp;hud=0">
<script>
  window.NZ_SHOT = {
    scene: 'weapons', mode: 'grid',
    width: 1920, height: 1080, ss: 2,
    warm: 12, settle: 14, prewarm: 60, fov: 60, lights: false, hud: false
  };
  location.replace('NUKEM.html?shot=weapons&mode=grid&width=1920&height=1080' +
                   '&ss=2&warm=12&settle=14&prewarm=60&fov=60&lights=0&hud=0');
</script>
<style>
  html,body{margin:0;height:100%;background:#08090b;color:#d8a018;
    font:14px/1.7 "Consolas","DejaVu Sans Mono","Courier New",monospace;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#8fb8ff}
</style>
</head>
<body>
<div>
  <div style="font-size:20px;letter-spacing:.2em">WEAPON VIEWMODEL CONTACT SHEET</div>
  <div style="color:#7d858e;margin-top:10px">
    pistol / shotgun / chaingun / rpg &times; idle, ADS, reload, flash<br>
    launching&hellip; if nothing happens,
    <a href="NUKEM.html?shot=weapons&amp;mode=grid&amp;width=1920&amp;height=1080&amp;ss=2&amp;warm=12&amp;settle=14&amp;prewarm=60&amp;fov=60&amp;lights=0&amp;hud=0">open it manually</a><br>
    screenshot once the tab title reads <b style="color:#d8a018">SHOT READY</b>
  </div>
</div>
