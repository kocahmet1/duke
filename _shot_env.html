<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SHOT LAUNCHER &mdash; ENVIRONMENT</title>
<!--
  ENVIRONMENT / ARCHITECTURE CONTACT SHEET
  ----------------------------------------
  Double-click this file. It needs no query string and no clicks: it hands the
  shot configuration to NUKEM.html on the URL, which cannot be typed by hand
  into File Explorer but is perfectly legal for a page to navigate to.

  9 camera presets covering the most representative interior and exterior
  areas of the level, each held motionless until TAA has converged, then
  composited into one 1920x1080 labelled contact sheet.

  Wait for the browser tab title to read "SHOT READY", then screenshot.
-->
<meta http-equiv="refresh" content="2;url=NUKEM.html?shot=env&amp;mode=grid&amp;width=1920&amp;height=1080&amp;ss=2&amp;warm=10&amp;settle=18&amp;prewarm=60&amp;fov=60&amp;hud=0">
<script>
  /* window.NZ_SHOT is honoured by nz-shots.js and is the documented way to
     configure a shot page; the query string carries the same values across
     the navigation, because a page cannot inject globals into its successor. */
  window.NZ_SHOT = {
    scene: 'env', mode: 'grid',
    width: 1920, height: 1080, ss: 2,
    warm: 10, settle: 18, prewarm: 60, fov: 60, hud: false
  };
  location.replace('NUKEM.html?shot=env&mode=grid&width=1920&height=1080' +
                   '&ss=2&warm=10&settle=18&prewarm=60&fov=60&hud=0');
</script>
<style>
  html,body{margin:0;height:100%;background:#08090b;color:#d8a018;
    font:14px/1.7 "Consolas","DejaVu Sans Mono","Courier New",monospace;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#8fb8ff}
</style>
</head>
<body>
<div>
  <div style="font-size:20px;letter-spacing:.2em">ENVIRONMENT CONTACT SHEET</div>
  <div style="color:#7d858e;margin-top:10px">
    9 presets &middot; 1920&times;1080 sheet &middot; 3&times;3 &middot; seed 20260802<br>
    launching&hellip; if nothing happens,
    <a href="NUKEM.html?shot=env&amp;mode=grid&amp;width=1920&amp;height=1080&amp;ss=2&amp;warm=10&amp;settle=18&amp;prewarm=60&amp;fov=60&amp;hud=0">open it manually</a><br>
    screenshot once the tab title reads <b style="color:#d8a018">SHOT READY</b>
  </div>
</div>
</body>
</html>
